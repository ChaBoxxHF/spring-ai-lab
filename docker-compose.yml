services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: spring_ai_lab
      POSTGRES_USER: spring_ai_lab
      POSTGRES_PASSWORD: spring_ai_lab
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spring_ai_lab -d spring_ai_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
