spring:
  application:
    name: spring-ai-lab
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spring_ai_lab}
    username: ${DB_USERNAME:spring_ai_lab}
    password: ${DB_PASSWORD:spring_ai_lab}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
